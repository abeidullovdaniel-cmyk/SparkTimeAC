name: Build Plugin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Unzip and Build
        run: |
          unzip -o *.zip
          POM_PATH=$(find . -maxdepth 3 -name "pom.xml" | head -n 1)
          DIR_PATH=$(dirname "$POM_PATH")
          cd "$DIR_PATH"
          mvn clean package
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp target/*.jar "$GITHUB_WORKSPACE/output/"
      - uses: actions/upload-artifact@v4
        with:
          name: Compiled-Plugin
          path: output/*.jar
